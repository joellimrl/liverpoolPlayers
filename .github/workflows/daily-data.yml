name: Refresh data and publish static site

on:
  schedule:
    - cron: '17 3 * * *' # Daily 03:17 UTC / 11:17 Singapore
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refresh every discovered historical season (slower)
        type: boolean
        default: false
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'data/**'
      - 'package*.json'
      - 'index.html'
      - '.github/workflows/daily-data.yml'

permissions:
  contents: read

concurrency:
  group: red-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Pull openly licensed Wikipedia data
        if: github.event_name != 'push'
        env:
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            npm run refresh -- --full
          else
            npm run refresh
          fi
      - run: npm run build
      - run: npm run check
      - name: Commit the verified snapshot and HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/archive.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Liverpool data and static page'
            git push
          fi
      - name: Stage only the public HTML
        run: |
          mkdir -p public-site
          cp index.html public-site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public-site
          retention-days: 1

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # You enable Pages yourself: Settings > Pages > Source > GitHub Actions.
      # Explicit deployment is necessary: GITHUB_TOKEN commits do not trigger a branch Pages build.
      - name: Publish index.html to your configured Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
